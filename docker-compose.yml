version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: lpn-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: lpn_mongo_password_change_me
      MONGO_INITDB_DATABASE: lpn-pro-mlm
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - lpn-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lpn-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:lpn_mongo_password_change_me@mongodb:27017/lpn-pro-mlm?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_min_32_characters_long_change_me
      JWT_EXPIRE: 30d
      FRONTEND_URL: http://localhost:3000
      # Add other environment variables as needed
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - lpn-network
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lpn-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_PAYSTACK_PUBLIC_KEY: pk_test_your_paystack_public_key
      REACT_APP_FLUTTERWAVE_PUBLIC_KEY: FLWPUBK-your_flutterwave_public_key
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - lpn-network
    command: npm start

  # Redis (Optional - for caching and session management)
  redis:
    image: redis:7-alpine
    container_name: lpn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lpn-network
    command: redis-server --appendonly yes

  # Nginx (Production reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: lpn-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_build:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - lpn-network
    profiles:
      - production

networks:
  lpn-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  frontend_build:
    driver: local

# Development override
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
---
# docker-compose.dev.yml
version: '3.8'

services:
  backend:
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start

# Production override  
# Use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
---
# docker-compose.prod.yml
version: '3.8'

services:
  backend:
    environment:
      NODE_ENV: production
    command: npm start
    
  frontend:
    command: npm run build && serve -s build -l 3000

  nginx:
    profiles: []